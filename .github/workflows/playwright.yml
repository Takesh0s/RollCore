# ─────────────────────────────────────────────────────────────────────────────
# RollCore — Playwright E2E Pipeline
# Architecture Reference: Section 7 · Test Plan Section 2.3.4
#
# Starts a full stack (PostgreSQL → Spring Boot → Vite) on the CI runner,
# then runs all E2E tests against Chromium only.
#
# Concurrency: push and pull_request events use separate groups so a PR run
# is never cancelled by its corresponding push and vice-versa.
# ─────────────────────────────────────────────────────────────────────────────

name: Playwright E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Includes github.event_name so push and pull_request runs on the same branch
# occupy different concurrency groups and do not cancel each other.
concurrency:
  group: playwright-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E — Chromium
    timeout-minutes: 30
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rollcore
          POSTGRES_USER: rollcore
          POSTGRES_PASSWORD: rollcore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rollcore -d rollcore"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Build backend (skip tests)
        run: |
          chmod +x mvnw
          ./mvnw -f backend/pom.xml --no-transfer-progress package -DskipTests

      - name: Start Spring Boot API
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/rollcore
          SPRING_DATASOURCE_USERNAME: rollcore
          SPRING_DATASOURCE_PASSWORD: rollcore
          JWT_SECRET: e2e-ci-secret-must-be-at-least-256-bits-long-for-hmac-sha256!!
          CORS_ORIGINS: http://localhost:5173
          SPRING_PROFILES_ACTIVE: default
          PORT: 8080
        run: java -jar backend/target/*.jar &

      # Polls /actuator/health until Spring context and Flyway migrations are fully
      # complete — health returns UP only after all migration scripts have run.
      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -sf http://localhost:8080/actuator/health 2>/dev/null)
            if echo "$STATUS" | grep -q '"status":"UP"'; then
              echo "✅ API is UP"; break
            fi
            echo "attempt $i/30 — sleeping 5s"; sleep 5
          done
          curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"' \
            || (echo "❌ API never started" && exit 1)

      - name: Start Vite dev server
        run: npm run dev &

      # Uses wait-on instead of a plain curl loop — curl returns 200 as soon as Vite
      # answers the first request, but modules may still be compiling in memory.
      # wait-on blocks until the TCP port is stable and accepting connections.
      - name: Wait for frontend to be ready
        run: npx wait-on http://localhost:5173 --timeout 60000

      - name: Run Playwright E2E tests
        env:
          CI: true
          BASE_URL: http://localhost:5173
        run: npx playwright test --project=chromium

      - name: Upload Playwright Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 30