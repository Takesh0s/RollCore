# ─────────────────────────────────────────────────────────────────────────────
# RollCore — Frontend CI
# Valida que os dois apps compilam de forma independente:
#   web/    → tsc + vite build   (web-app, web para PC e base do app Steam)
#   mobile/ → tsc + expo export  (app nativo; export web usado só para validar)
# ─────────────────────────────────────────────────────────────────────────────

name: Frontend

on:
  push:
    branches: [main, develop, mobile-rollcore]
    paths: ['web/**', 'mobile/**', '.github/workflows/frontend.yml']
  pull_request:
    branches: [main, develop, mobile-rollcore]
    paths: ['web/**', 'mobile/**', '.github/workflows/frontend.yml']

concurrency:
  group: frontend-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  mobile:
    name: Mobile (Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build